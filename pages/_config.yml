# Jekyll configuration for the blog series published from pages/ by
# .github/workflows/pages.yml (actions/jekyll-build-pages, github-pages gem).

title: Building a Streamhouse on Confluent Cloud
description: >-
  A hands-on series on Kafka, Flink materialized tables, Lightning Tables,
  Tableflow, and a streaming agent on Confluent Cloud, with measured results.
lang: en

# minima 2.5.1 is the version the github-pages gem pins.
theme: minima

# Keep the header navigation to the series index; each post links to the next.
header_pages:
  - index.md

defaults:
  - scope:
      path: ""
    values:
      layout: page

plugins:
  - jekyll-relative-links # turns links to .md files into links to the built pages
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: false

kramdown:
  input: GFM
