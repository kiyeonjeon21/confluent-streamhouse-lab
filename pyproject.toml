[project]
name = "streamhouse-lab"
version = "0.1.0"
description = "Hands-on lab for the Confluent Cloud Streamhouse: Kafka, Flink SQL, materialized tables, Lightning Tables, Tableflow, and the Real-Time Context Engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
]

[project.scripts]
lab = "streamhouse_lab.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = [
  "live: talks to Confluent Cloud and incurs charges; run with `uv run pytest -m live` after deploying",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
  "S603", # subprocess calls use fixed argv lists, never a shell
  "S607", # terraform and confluent are resolved from PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
